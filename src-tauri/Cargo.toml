[package]
name = "resume-studio"
version = "0.1.0"
description = "简历编辑器桌面壳（Tauri 2.x）：飞书调用原生转发 + 凭证保管"
edition = "2021"
rust-version = "1.77.2"
default-run = "resume-studio"

[lib]
name = "resume_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# features = []：只用核心能力，插件按需追加（本项目不含任何 Tauri 官方插件）
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# 必须走 rustls（自带 TLS 实现），避免 Windows/Linux 上依赖 openssl 系统库
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "multipart",
] }

[features]
# tauri build（生产）时 CLI 会自动启用该特性，使前端资源走自定义协议而非 devServer。
# DO NOT REMOVE
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
