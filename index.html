<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 必须带 viewport-fit：缺它时 env(safe-area-inset-*) 在 iOS / Android edge-to-edge 下恒为 0，
     P1 加的刘海与底部手势条留白会全部失效（变死代码） -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 移动端浏览器工具条着色，由 js/theme.js 跟随主题更新（桌面端无害） -->
<meta name="theme-color" content="#f0f0f0">
<title>简历编辑器（拖拽排版 / 纯文本编辑）</title>

<!-- 首屏防闪：在样式与业务脚本之前就把主题属性落到 <html> 上，避免深色首帧发白。
     key 必须与 js/theme.js 里的 MODE_KEY / PAPER_KEY 保持一致；
     纸张默认跟随夜间（除非手动存过 '0' 关闭）。 -->
<script>
(function(){
  try{
    var m = localStorage.getItem('resume-theme-mode');
    var p = localStorage.getItem('resume-theme-paper') !== '0';
    var dark = (m === 'dark') ||
      (m !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if(dark){
      document.documentElement.setAttribute('data-theme','dark');
      if(p) document.documentElement.setAttribute('data-paper','dark');
    }
  }catch(e){}
})();
</script>

<link rel="stylesheet" href="css/style.css">
<!-- 多页面骨架（P0）：全局 rail / view-root / 路由 class 显隐。必须在 style.css 之后、被其覆盖 -->
<link rel="stylesheet" href="css/layout.css">
<!-- AI 助手面板（阶段 1：壳 + 状态显示） -->
<link rel="stylesheet" href="css/ai.css">

<!-- 第三方库：PDF 导出用（html2canvas 截图 + jsPDF 拼页），本地存放，离线可用 -->
<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<!-- 第三方库：飞书扫码注册用的二维码渲染（纯 JS，UMD 全局 qrcode），本地存放，离线可用 -->
<script src="vendor/qrcode-generator.js"></script>

</head>
<body>

<div class="app mv-preview">

  <!-- 多简历：左抽屉（简历列表）。桌面默认常驻、可收缩；手机点「简历」按钮全屏滑出 -->
  <aside class="resume-drawer open" id="resumeDrawer">
    <div class="resume-drawer-head">
      <span class="resume-drawer-title">我的简历</span>
      <span class="resume-drawer-head-right">
        <button class="resume-drawer-new" id="resumeNewBtn" onclick="ResumeEditor.resumeNew()" title="新建一份空白简历">＋ 新建</button>
        <button class="resume-drawer-new ghost" id="resumeUploadBtn" onclick="document.getElementById('resumeImportFile').click()" title="上传 PDF / JSON 简历，导入为一份新简历">上传</button>
        <!-- 消息通知铃铛：自动同步告警 / 拉取 / 失败等消息中心（js/ui/notifier.js） -->
        <button type="button" class="notif-bell-btn" id="notifBell" title="消息通知">🔔</button>
        <button class="resume-drawer-collapse" id="resumeDrawerCollapse" onclick="ResumeEditor.toggleResumeDrawer()" title="收起简历列表">&lsaquo;</button>
      </span>
    </div>
    <div class="resume-drawer-list" id="resumeList"></div>
    <!-- 批量导入进度面板：多文件上传时显示聚合进度 + 逐文件状态（feishu-sync.js 控制） -->
    <div class="upload-progress" id="uploadProgress" hidden>
      <div class="upload-progress-head">
        <span id="uploadProgressTitle">正在导入…</span>
        <span class="upload-progress-count" id="uploadProgressCount"></span>
      </div>
      <div class="upload-progress-bar"><div class="upload-progress-fill" id="uploadProgressFill"></div></div>
      <div class="upload-progress-list" id="uploadProgressList"></div>
    </div>
    <input type="file" id="resumeImportFile" accept=".pdf,.json,application/pdf,application/json" multiple style="display:none" onchange="ResumeEditor.importResumeFile(this)">
  </aside>

  <!-- 抽屉收起时贴在左缘的展开把手 -->
  <button class="resume-drawer-expand" id="resumeDrawerExpand" onclick="ResumeEditor.toggleResumeDrawer()" title="展开简历列表">&rsaquo;</button>

  <div class="preview-pane">
        <!-- ============================================================
         右缘侧边标签栏（side-rail）+ 右缘推展面板（side-panel）
         原顶部菜单栏已收纳进「工具菜单」面板，把手与「编辑面板」同款竖排样式。
         —— 以后新增同类标签的规划 ——
           1) 往 .side-rail 里加一个 .pane-tab 按钮，data-panel 指向面板 id；
           2) 在 .app 里（.editor-pane 之后）加一个 .side-panel（id 与 data-panel 对应），
              内容用 .side-group 分组、扁平按钮；
           3) 点击用 ResumeEditor.toggleSidePanel('面板id')，展开/收起自动持久化。
         多标签放置规则：rail 垂直居中、自上而下堆叠（gap 10px，超出可滚动）；
         面板与编辑面板同款右缘推展（flex 兄弟列、通栏到底、宽 460），
         同一时间只展开一个 .side-panel，且与编辑面板互斥（多选一）。
         ============================================================ -->
    <div class="side-rail" id="sideRail">
      <button class="pane-tab" data-panel="toolsPanel" onclick="ResumeEditor.toggleSidePanel('toolsPanel')" title="展开工具菜单">
        <span class="pane-tab-arrow">&lsaquo;</span>
        <span class="pane-tab-label">工具菜单</span>
      </button>
      <button class="pane-tab" id="paneTab" onclick="ResumeEditor.toggleEditorPane()" title="收起编辑面板 (Ctrl/Cmd+B)">
        <span class="pane-tab-arrow" id="paneTabArrow">&rsaquo;</span>
        <span class="pane-tab-label">编辑面板</span>
      </button>
    </div>

    <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="ResumeEditor.importJSON(this)">
    <!-- 保存状态条：常驻显示「编辑中 / 保存中 / 已保存 HH:MM / 失败·可重试」。
         此前这套反馈三重不可见（面板默认收起、手机被 display:none、写盘失败被静默降级吞掉），
         本状态条把「改动是否真的落盘」变成屏幕上一行如实的状态；role=status + aria-live
         让读屏同样能收到保存结果。文案与状态机在 js/ui/save-status.js。 -->
    <div class="save-bar" id="saveBar" role="status" aria-live="polite" hidden>
      <span class="save-bar-text"></span>
      <button type="button" class="save-bar-retry" hidden>重试</button>
    </div>
    <div class="preview-frame" id="preview"></div>
  </div>

  <div class="editor-pane">
    <div class="panel" id="panel-fonts">
      <div class="panel-header collapsible" data-panel="panel-fonts">字号配置（px）<span class="chevron">▾</span></div>
      <div class="panel-body"><div class="font-settings" id="settings"></div></div>
    </div>

    <div class="panel" id="panel-margins">
      <div class="panel-header collapsible" data-panel="panel-margins">
        <span style="flex:1;">页面边距（mm）</span>
        <button class="mini-btn" style="height:22px;font-size:11px;" onclick="ResumeEditor.resetMargins()">恢复默认</button>
        <span class="chevron">▾</span>
      </div>
      <div class="panel-body"><div class="font-settings" id="marginSettings"></div></div>
    </div>

    <div class="panel" id="panel-spacing">
      <div class="panel-header collapsible" data-panel="panel-spacing">
        <span style="flex:1;">间距配置（px）</span>
        <button class="mini-btn" style="height:22px;font-size:11px;" onclick="ResumeEditor.resetSpacing()">恢复默认</button>
        <span class="chevron">▾</span>
      </div>
      <div class="panel-body"><div class="font-settings" id="spacingSettings"></div></div>
    </div>

    <!-- 投递体检：纯规则检查（页数 / 完整性 / 量化 / ATS），点击标题展开并重新检查 -->
    <div class="panel collapsed" id="panel-audit">
      <div class="panel-header" onclick="ResumeAudit.toggle()">
        <span style="flex:1;">投递体检（页数 / 内容 / ATS）</span>
        <span class="chevron">▾</span>
      </div>
      <div class="panel-body"><div id="auditBody"></div></div>
    </div>

    <!-- JD 匹配分析：粘贴目标岗位 JD，把「任职要求」拆成关键词并与当前简历比对，
         分成已覆盖 / 弱覆盖 / 缺失三档。纯规则只读匹配；JD 原文只存浏览器偏好
         （localStorage），不写进简历数据、不随飞书同步。实现见 js/jd-match.js。 -->
    <div class="panel collapsed" id="panel-jd">
      <div class="panel-header" onclick="ResumeJd.toggle()">
        <span style="flex:1;">JD 匹配分析（已覆盖 / 弱覆盖 / 缺失）</span>
        <span class="chevron">▾</span>
      </div>
      <div class="panel-body">
        <div class="jd-input-wrap">
          <textarea id="jdInput" class="jd-input" rows="4" spellcheck="false"
            placeholder="粘贴目标岗位的「任职要求 / 岗位职责」原文…（只存在本机浏览器，不写进简历数据、不随同步上传）"
            oninput="ResumeJd.setJd(this.value)"></textarea>
          <div class="jd-input-foot">
            <button class="mini-btn" onclick="ResumeJd.analyzeNow()" title="按当前 JD 与当前简历重新匹配">分析匹配度</button>
            <button class="mini-btn" onclick="ResumeJd.clearJd()" title="清空 JD 与分析结果">清空</button>
            <span class="jd-input-hint">改完简历再点一次即刷新</span>
          </div>
        </div>
        <div id="jdBody"></div>
      </div>
    </div>

    <div class="panel panel-grow" id="panel-editor">
      <div class="panel-header collapsible" data-panel="panel-editor">内容编辑（仅改文字，代码自动生成）<span class="chevron">▾</span></div>
      <div class="panel-body">
        <div class="hint">左侧预览中可用鼠标拖拽板块/条目重排顺序；右侧只修改纯文本，无需写代码。每行字段均提供「上间距 / 下间距」微调，数值会与上方「间距配置」中的全局默认值叠加，只影响当前这一行。</div>
        <div class="editor-scroll" id="editor"></div>
      </div>
    </div>
  </div>

  <!-- 工具菜单面板：原顶部菜单栏全部功能，扁平分组（不再嵌套下拉）。
       与 .editor-pane 同款右缘推展：.app 的 flex 兄弟列、通栏到底、宽 460，
       与编辑面板多选一互斥（app.js 侧保证），展开时预览被推挤重排、纸张自动重新居中缩放。 -->
  <aside class="side-panel" id="toolsPanel">
    <div class="side-panel-head">
      <span class="side-panel-title">工具菜单</span>
      <span class="autosave" id="feishuStatus"></span>
      <span class="autosave" id="autosave"></span>
    </div>
    <!-- 按钮清单由 js/ui/menu-actions.js 渲染（与手机 sync-pane 同源）。
         ⚠️ 不要再往这里手写按钮：两份手写清单必然漂移 —— 此前桌面缺飞书同步与页面导航、
         手机缺打印 / 撤销 / 重做 / 文件名，就是这么来的。加功能请改 ACTIONS 清单。 -->
    <div class="side-panel-body"><div id="toolsMenuBody"></div></div>
  </aside>

  <!-- 手机底部 Tab 导航：预览 / 编辑 / 同步（桌面隐藏） -->
  <nav class="mobile-tabbar">
    <button data-mv="preview" class="active" onclick="ResumeEditor.setMobileView('preview')">预览</button>
    <button data-mv="edit" onclick="ResumeEditor.setMobileView('edit')">编辑</button>
    <button data-mv="sync" onclick="ResumeEditor.setMobileView('sync')">同步</button>
  </nav>

  <!-- 手机「同步 / 工具」聚合页：与桌面工具菜单渲染**同一份**清单（js/ui/menu-actions.js 的 ACTIONS），
       因此两端不可能再出现「一边有、一边没有」。 -->
  <div class="sync-pane">
    <div class="sync-inner">
      <h2 class="sync-title">同步 / 工具</h2>
      <span class="autosave" id="feishuStatusMobile"></span>
      <div id="syncMenuBody"></div>
    </div>
  </div>
</div>

<!-- PDF 预览弹层 -->
<div class="pdf-modal" id="pdfModal">
  <div class="pdf-modal-box">
    <div class="pdf-modal-bar">
      <span class="t">PDF 预览</span>
      <span class="pg" id="pdfPageInfo"></span>
      <span class="sp"></span>
      <button class="dl" onclick="ResumeEditor.downloadPDFNow()">下载 PDF</button>
      <button class="close" onclick="ResumeEditor.closePdfModal()">关闭</button>
    </div>
    <div class="pdf-modal-body">
      <iframe id="pdfFrame" title="PDF 预览"></iframe>
    </div>
  </div>
</div>

<!-- 通用导出预览弹层（图片版 / 单文件 HTML 共用：先看预览，再点下载） -->
<div class="pdf-modal" id="exportModal">
  <div class="pdf-modal-box">
    <div class="pdf-modal-bar">
      <span class="t" id="exportModalTitle">预览</span>
      <span class="sp"></span>
      <button class="dl" id="exportModalDownload" onclick="ResumeEditor.doExportDownload()">下载</button>
      <button class="close" onclick="ResumeEditor.closeExportModal()">关闭</button>
    </div>
    <div class="pdf-modal-body">
      <img id="exportModalImg" alt="导出预览" style="display:none;">
      <iframe id="exportModalFrame" title="导出预览" style="display:none;"></iframe>
    </div>
  </div>
</div>



<!-- 本项目代码：data.js 必须在 app.js 之前加载；放在 body 末尾，确保 DOM 就绪 -->
<!-- 主题（日间 / 夜间）：必须最先加载，保证首帧就是正确的明暗 -->
<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<!-- P0 数据门面：必须在 app.js 之前加载，保证 window.ResumeStore 先于 app.js 可用 -->
<script src="js/store/resume-store.js"></script>
<!-- M1 多简历仓库：必须在 app.js 之前加载，保证 window.ResumeLibrary 先于 app.js 可用 -->
<script src="js/store/resume-library.js"></script>
<!-- P2 原生桥：仅在 Tauri 壳内注入 window.__RESUME_NATIVE__，浏览器下不做任何事 -->
<script src="js/store/native-bridge.js"></script>
<!-- M4 多数据源：契约注册表 + 本地/飞书适配器（须在 resume-store / resume-library 之后） -->
<script src="js/store/datasource.js"></script>
<script src="js/store/adapter-local.js"></script>
<script src="js/store/adapter-feishu.js"></script>
<!-- P0 多页面路由：微型 hash 路由 + 全局 rail + 各 view。须在 app.js 之前（只定义对象，不执行业务） -->
<script src="js/router/router.js"></script>
<script src="js/router/layout.js"></script>
<script src="js/views/library-view.js"></script>
<script src="js/views/editor-view.js"></script>
<script src="js/views/settings-view.js"></script>
<script src="js/views/history-view.js"></script>
<script src="js/views/tracker-view.js"></script>
<script src="js/views/templates-view.js"></script>
<script src="js/views/portfolio-view.js"></script>
<!-- 内容编辑区 schema（字段 / 列表 / 板块类型注册表 + 通用渲染与写回引擎）：
     必须在 resume-render.js 之前加载 —— 后者从这里取 esc/T/z/objify/blank* 基础件，
     并按注册表生成右侧表单。新增板块类型只需在 editor-schema.js 里 register 一次。 -->
<script src="js/render/editor-schema.js"></script>
<script src="js/render/resume-render.js"></script>
<script src="js/export/export-pdf.js"></script>
<script src="js/feishu/feishu-sync.js"></script>
<!-- 统一入口清单：桌面工具菜单 + 手机 sync-pane 的按钮都由它渲染。
     必须早于 pane-mobile.js / app.js —— 它们在初始化时按 id 找按钮（paneToggleBtn 等）。 -->
<script src="js/ui/menu-actions.js"></script>
<!-- 保存状态条（保存三态 + 存储降级告警）：须在 store 之后、app.js 之前 -->
<script src="js/ui/save-status.js"></script>
<!-- 消息通知中心（自动同步告警等）：不依赖其他业务模块，app.js 前加载 -->
<script src="js/ui/notifier.js"></script>
<script src="js/ui/pane-mobile.js"></script>
<!-- JSON Resume 互操作适配器（纯函数，无依赖）：app.js 前加载，供导入/导出 JSON Resume 使用 -->
<script src="js/io/jsonresume-adapter.js"></script>
<script src="js/app.js"></script>
<!-- P0 路由启动：注册路由并 start（必须在 app.js 之后，因为 view.onEnter 会调 ResumeEditor） -->
<!-- AI 助手（阶段 1：presets / provider / panel 壳） -->
<script src="js/ai/presets.js"></script>
<script src="js/ai/provider.js"></script>
<script src="js/ai/ui/panel.js"></script>
<script src="js/router/bootstrap.js"></script>
<!-- T7 投递链路：两者均只读消费 ResumeEditor.getData()，必须在 app.js 之后加载 -->
<script src="js/export-extra.js"></script>
<script src="js/audit.js"></script>
<!-- JD 匹配分析（粘贴岗位 JD → 关键词覆盖三档）：同样只读消费 ResumeEditor.getData()，
     与 audit.js 平级、互不依赖，放在最后便于两者共用一套面板视觉词汇。 -->
<script src="js/jd-match.js"></script>
</body>
</html>
