name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 运行核心逻辑测试
        run: npm test
      - name: 验证单文件版可构建且 dist/根目录两份字节一致
        run: npm run build
