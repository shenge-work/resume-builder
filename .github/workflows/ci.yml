name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # action 主版本取「当前最新稳定」：checkout / setup-node 均已到 v7。
      # v4 系列跑在 Node 20 上，GitHub 已弃用并会在日志里刷 deprecation 警告。
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 运行核心逻辑测试
        run: npm test
      - name: 构建单文件版（离线分发用）
        run: npm run build
      - name: 校验前端资源完整性（防止新增模块漏接线 / 漏打包 / 隐私目录泄漏）
        run: |
          npm run desktop:assets
          node tools/verify-frontend-assets.js
