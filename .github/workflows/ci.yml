name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 运行核心逻辑测试
        run: npm test
      - name: 构建单文件版（离线分发用）
        run: npm run build
      - name: 校验前端资源完整性（防止新增模块漏接线 / 漏打包 / 隐私目录泄漏）
        run: |
          npm run desktop:assets
          node tools/verify-frontend-assets.js
