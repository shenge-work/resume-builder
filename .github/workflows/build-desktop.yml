name: Build Desktop

# 三平台矩阵构建 Tauri 安装包：macOS → dmg，Windows → msi + nsis，Linux → AppImage + deb
# 说明：macOS 上无法交叉产出 Windows msi/nsis，Windows 包必须由 windows-latest 或本机 Windows 产出，
#       因此本 workflow 是「三端安装包」的主路径（详见 docs/桌面版构建说明.md）。
on:
  push:
    branches:
      - main
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'template.json'
      - 'vendor/**'
      - 'src-tauri/**'
      - 'tools/build-desktop-frontend.js'
      - 'tools/gen-icons.js'
      - 'package.json'
      - '.github/workflows/build-desktop.yml'
  pull_request:
  workflow_dispatch:
  # 供 .github/workflows/release.yml 复用（发版时调用）。
  # 复用而不是复制一份构建逻辑，是为了保证「平时 CI 冒烟构建」与「发版构建」
  # 走的是同一条代码路径 —— 否则两套配置迟早漂移，出现「CI 绿的、发版挂的」。
  workflow_call:

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS · dmg
            os: macos-latest
            bundles: dmg
            artifact: resume-studio-macos
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows · msi + nsis
            os: windows-latest
            bundles: msi,nsis
            artifact: resume-studio-windows
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux · AppImage + deb
            os: ubuntu-latest
            bundles: appimage,deb
            artifact: resume-studio-linux
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Linux 系统依赖（webkit2gtk / appindicator / rsvg / patchelf）
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # 注意：libappindicator3-dev 在 ubuntu-24.04（当前 ubuntu-latest）已从源里移除，
          # 与可用包写进同一条 apt-get install 会让整条命令失败、job 直接变红。
          # 因此拆成两步：必需包先装，托盘依赖走 libayatana-appindicator3-dev 兜底。
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev
          sudo apt-get install -y libayatana-appindicator3-dev \
            || sudo apt-get install -y libappindicator3-dev

      - name: 设置 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 设置 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖
        run: npm install

      - name: 构建桌面安装包
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }}

      - name: 上传安装包 artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          # artifact 不可变，且 overwrite 默认 false：重跑时上次 attempt 的同名 artifact 仍在，
          # 上传会直接失败。理由详见 release.yml 里 release-meta 那段注释。
          overwrite: true
          retention-days: 14
