name: Release

# 一键出包并发版：三平台桌面（msi / nsis / dmg / AppImage / deb）+ Android（APK / AAB），
# 聚合成一个 GitHub Release，并附带版本号与更新说明。
#
# 触发方式（两种任选，见 docs/发版说明.md）：
#   1) 推标签（推荐，最标准）：git tag v1.1.0 && git push origin v1.1.0
#   2) Actions 页面手动 Run workflow，填版本号；gh 会基于当前 commit 自动创建标签
#
# 三条设计约束：
#   · 版本号唯一权威 = src-tauri/tauri.conf.json 的 version，package.json 必须一致，
#     否则本 workflow 直接失败 —— 避免「发出去的包版本号与仓库对不上」。
#   · Release 的更新说明从 CHANGELOG.md 的对应版本章节自动抽取；找不到就发版失败
#     —— 即「必须有版本更新描述」。
#   · 构建逻辑不在这里重复实现，而是复用 build-desktop.yml / build-android.yml
#     （通过 workflow_call），保证 CI 冒烟用的构建与发版用的构建是同一条代码路径。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（不带 v 前缀），例如 1.1.0。必须与仓库内 tauri.conf.json / package.json 的 version 一致'
        required: true
        type: string
      prerelease:
        description: '标记为预发布（Pre-release）'
        required: false
        type: boolean
        default: false
      draft:
        description: '先建为草稿（不公开）'
        required: false
        type: boolean
        default: false

# 默认只读；只有真正写 Release 的那个 job 才提权到 write。
permissions:
  contents: read

# 同一标签的两次发版不要并发（后一次会 clobber 前一次的资产）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. 解析版本号 → 校验仓库内一致 → 抽取 CHANGELOG 更新说明
  # ─────────────────────────────────────────────────────────────
  prepare:
    name: 解析版本与更新说明
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          # 需要完整历史，便于后续排查「这个标签打在哪个 commit 上」
          fetch-depth: 0

      - name: 设置 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 发版前的硬门槛：测试不过就不许发版。
      # 这里刻意不跑 npm install —— 测试套件是纯 Node、零依赖。
      - name: 运行测试（发版前硬门槛）
        run: npm test

      - name: 解析版本号
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            # 标签触发：v1.1.0 → 1.1.0
            VERSION="${REF_NAME#v}"
          fi
          # 去掉可能被粘进来的空白
          VERSION="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error title=版本号格式不合法::取到「${VERSION}」，应为 x.y.z 或 x.y.z-预发布后缀（标签形如 v1.1.0）"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### 🚀 发版：Resume Studio v$VERSION"
            echo
            echo "- 触发方式：\`$EVENT_NAME\`（\`$REF_NAME\`）"
            echo "- 提交：\`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 校验仓库内版本号一致
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          TAURI=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          PKG=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          echo "src-tauri/tauri.conf.json = $TAURI"
          echo "package.json              = $PKG"
          echo "本次要发布的版本          = $VERSION"
          # ⚠️ 变量一律写成 ${VAR}：bash 在 UTF-8 locale（CI 上是 C.UTF-8）下会把紧跟其后的
          # 多字节字符吃进变量名 —— `$VERSION」` 会被当成变量 `VERSION」`，报 unbound variable。
          # 本地 `LC_ALL=C` 下反而正常，极易漏掉。
          ok=1
          if [ "$TAURI" != "$VERSION" ]; then
            echo "::error title=版本号不一致::src-tauri/tauri.conf.json 是「${TAURI}」，而要发布的是「${VERSION}」"
            ok=0
          fi
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error title=版本号不一致::package.json 是「${PKG}」，而要发布的是「${VERSION}」"
            ok=0
          fi
          if [ "$ok" != "1" ]; then
            echo "::error title=怎么改::先把上面两个文件的 version 改成 ${VERSION} 并提交到 main，再用同一个版本号发版。详见 docs/发版说明.md"
            exit 1
          fi
          echo "::notice::版本号一致（${VERSION}），继续出包"

      - name: 从 CHANGELOG.md 抽取更新说明
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/notes-body.md"
          import io, os, re, sys

          version = os.environ['VERSION']
          text = io.open('CHANGELOG.md', encoding='utf-8').read()

          SEP = re.compile(r'\s*([-*_])\1{2,}\s*')   # --- / *** / ___

          def clean(body):
              """去掉首尾空行与分隔线 —— 否则 `暂无。` 后面跟着的 `---` 会让占位检查失效"""
              lines = body.splitlines()
              while lines and (not lines[0].strip() or SEP.fullmatch(lines[0])):
                  lines.pop(0)
              while lines and (not lines[-1].strip() or SEP.fullmatch(lines[-1])):
                  lines.pop()
              return '\n'.join(lines).strip()

          def section(name):
              """取 ## [name] 标题到下一个 ## [ 之间的正文"""
              pat = r'^## \[' + re.escape(name) + r'\][^\n]*\n(.*?)(?=^## \[|\Z)'
              m = re.search(pat, text, re.S | re.M)
              return clean(m.group(1)) if m else None

          body, src = section(version), version
          if not body:
              body, src = section('Unreleased'), 'Unreleased'
          # 「暂无。」这类占位不算更新说明，必须让发版失败而不是发一个空壳
          if not body or re.fullmatch(r'暂无[。.]?', body):
              sys.stderr.write(
                  f'::error title=缺少版本更新说明::CHANGELOG.md 里既没有 [{version}] 章节，'
                  f'也没有可用的 [Unreleased] 内容。请先在 CHANGELOG.md 写明本次更新，'
                  f'再重新发版（这是刻意设计的门槛，见 docs/发版说明.md）\n')
              sys.exit(1)

          out = []
          if src != version:
              out.append(f'> ⚠️ CHANGELOG.md 中未找到 `[{version}]` 章节，以下内容取自 `[Unreleased]`。')
              out.append('> 建议下次发版前先把 `[Unreleased]` 改名为 `[{version}] - 日期`。')
              out.append('')
          out.append(body)
          sys.stdout.write('\n'.join(out) + '\n')
          PY

          # 换行/体积检查：说明太短通常意味着抽错了章节
          LINES=$(wc -l < "$RUNNER_TEMP/notes-body.md")
          BYTES=$(wc -c < "$RUNNER_TEMP/notes-body.md")
          echo "抽取到更新说明 ${LINES} 行 / ${BYTES} 字节"
          if [ "$BYTES" -lt 80 ]; then
            echo "::warning title=更新说明过短::只抽到 ${BYTES} 字节，请确认 CHANGELOG.md 的 [$VERSION] 章节写完整了"
          fi

          mkdir -p "$RUNNER_TEMP/release-meta"
          mv "$RUNNER_TEMP/notes-body.md" "$RUNNER_TEMP/release-meta/notes.md"
          printf '%s\n' "$VERSION" > "$RUNNER_TEMP/release-meta/version.txt"
          echo "---- 更新说明预览（前 20 行）----"
          head -20 "$RUNNER_TEMP/release-meta/notes.md"

      # 走 artifact 而不是 job output：更新说明是多行文本，artifact 没有转义/长度风险
      - name: 上传发版元数据
        uses: actions/upload-artifact@v7
        with:
          name: release-meta
          path: ${{ runner.temp }}/release-meta
          # ⚠️ artifact 一旦创建即不可变，而 `overwrite` 默认是 false —— 同名时上传直接失败。
          # 「重跑」（Re-run all jobs）会新建一次 attempt，但**上一次 attempt 的 artifact 仍然在**，
          # 于是每个上传步骤都会撞名。偏偏「重跑」正是构建偶发失败时最自然的操作。
          overwrite: true
          # 保留期要覆盖「publish 被单独重跑」的时间窗。原先设成 1 天：次日重跑 publish 时
          # release-meta 已过期，download-artifact 拿不到 notes.md，发版会失败在「缺更新说明」。
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # 2. 复用既有构建 workflow（不复制构建逻辑）
  # ─────────────────────────────────────────────────────────────
  desktop:
    name: 桌面三平台
    needs: prepare
    uses: ./.github/workflows/build-desktop.yml

  android:
    name: Android
    needs: prepare
    uses: ./.github/workflows/build-android.yml
    # 签名凭据要给到被调用的 workflow，否则会静默退回 debug 签名
    secrets: inherit

  # ─────────────────────────────────────────────────────────────
  # 3. 聚合产物 → 归一化文件名 → 生成校验和 → 创建 Release
  # ─────────────────────────────────────────────────────────────
  publish:
    name: 创建 / 更新 GitHub Release
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 设置 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 顺带出一份「离线单文件版」HTML：双击即用、无需安装，适合当轻量分发载体
      - name: 构建单文件版 HTML
        run: |
          set -euo pipefail
          npm run build
          ls -l dist/

      - name: 下载全部构建产物
        uses: actions/download-artifact@v8
        with:
          path: rel
          merge-multiple: true

      - name: 归一化文件名并生成校验和
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          echo "=== 下载到的原始文件 ==="
          find rel -type f | sort
          mkdir -p out

          # 取第一个匹配的文件并改名搬走；没有匹配就返回 1（由调用方决定是否容忍）
          take() {
            local src
            src=$(find rel -type f -name "$1" -print -quit)
            if [ -z "$src" ]; then
              return 1
            fi
            mv "$src" "out/$2"
            echo "  $src  ->  $2"
          }

          # ---- Windows ----
          take '*.msi'       "Resume-Studio-${VERSION}-windows-x64.msi"       || true
          take '*-setup.exe' "Resume-Studio-${VERSION}-windows-x64-setup.exe" || true

          # ---- macOS（架构从原始文件名推断：Tauri 会带 aarch64 / x64）----
          DMG=$(find rel -type f -name '*.dmg' -print -quit)
          if [ -n "$DMG" ]; then
            case "$DMG" in
              *aarch64*|*arm64*)       ARCH=arm64 ;;
              *x64*|*x86_64*|*amd64*)  ARCH=x64 ;;
              *)                       ARCH=universal ;;
            esac
            mv "$DMG" "out/Resume-Studio-${VERSION}-macos-${ARCH}.dmg"
            echo "  $DMG  ->  Resume-Studio-${VERSION}-macos-${ARCH}.dmg"
          fi

          # ---- Linux ----
          take '*.AppImage' "Resume-Studio-${VERSION}-linux-x86_64.AppImage" || true
          take '*.deb'      "Resume-Studio-${VERSION}-linux-amd64.deb"       || true

          # ---- Android ----
          APK=$(find rel -type f -name '*release*.apk' -print -quit)
          if [ -z "$APK" ]; then
            APK=$(find rel -type f -name '*.apk' -print -quit)
          fi
          if [ -n "$APK" ]; then
            mv "$APK" "out/Resume-Studio-${VERSION}-android.apk"
            echo "  $APK  ->  Resume-Studio-${VERSION}-android.apk"
          fi
          take '*.aab' "Resume-Studio-${VERSION}-android.aab" || true

          # ---- 离线单文件版 ----
          # ⚠️ 资产名必须用 ASCII：实测本地上传的 `Resume-Studio-1.1.0-单文件版.html`
          # 到了 Release 上会变成 `Resume-Studio-1.1.0-.html`（CJK 被剥掉）——
          # 于是「更新说明里写的文件名」与「用户实际看到的文件名」对不上，
          # `sha256sum -c` 也会在这一行报「没有那个文件」。中文说明放在表格的用途列里。
          # 取值上先认构建脚本约定的产物名（tools/build-single.js 的 OUT_FILE），
          # 只有它不存在时才退回通配 —— 避免 dist/ 里混有其它 html 时被「任取」。
          HTML="dist/简历编辑器-单文件.html"
          if [ ! -f "$HTML" ]; then
            HTML=$(find dist -maxdepth 1 -type f -name '*.html' -print -quit)
          fi
          if [ -n "$HTML" ] && [ -f "$HTML" ]; then
            mv "$HTML" "out/Resume-Studio-${VERSION}-standalone.html"
            echo "  $HTML  ->  Resume-Studio-${VERSION}-standalone.html（离线单文件版编辑器）"
          fi

          echo "=== 归一化后的发布资产 ==="
          ls -lh out/

          # 至少要有东西可发，否则宁可不发
          COUNT=$(find out -maxdepth 1 -type f | wc -l)
          if [ "$COUNT" -lt 3 ]; then
            echo "::error title=产物不足::只聚合到 $COUNT 个文件，构建产物可能没上传成功，已中止发版"
            exit 1
          fi

          ( cd out && sha256sum ./*  > SHA256SUMS.txt )
          echo "=== SHA256SUMS.txt ==="
          cat out/SHA256SUMS.txt

      - name: 生成 Release 说明
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # release-meta 是 prepare 上传的，merge-multiple 后落在 rel/ 根下。
          # 缺了它说明上游产物没传成功，这里给出明确报错而不是让 cat 抛 "No such file"。
          if [ ! -s rel/notes.md ]; then
            echo "::error title=缺 release-meta::没找到 rel/notes.md（prepare 的更新说明产物），无法生成 Release 描述"
            find rel -maxdepth 2 -type f | head -20
            exit 1
          fi
          {
            cat rel/notes.md
            echo
            echo '---'
            echo
            echo '### 📦 本次发布的安装包'
            echo
            echo '| 平台 / 用途 | 文件 |'
            echo '|---|---|'
            for f in out/*; do
              b=$(basename "$f")
              if [ "$b" = 'SHA256SUMS.txt' ]; then
                continue
              fi
              case "$b" in
                *.msi)        plat='Windows · MSI 安装包（适合批量/域部署）' ;;
                *-setup.exe)  plat='Windows · 安装程序（适合个人安装）' ;;
                *.dmg)        plat='macOS · 拖动到「应用程序」即可' ;;
                *.AppImage)   plat='Linux · 免安装（`chmod +x` 后双击）' ;;
                *.deb)        plat='Linux · Debian / Ubuntu 安装包' ;;
                *.apk)        plat='**Android · 直接安装到手机**' ;;
                *.aab)        plat='Android · Google Play 上架用' ;;
                *.html)       plat='任意浏览器 · 离线单文件版（双击即用，无需安装）' ;;
                *)            plat='其他' ;;
              esac
              size=$(du -h "$f" | cut -f1)
              echo "| ${plat} | \`${b}\`（${size}） |"
            done
            echo
            echo '全部文件的 SHA-256 见 `SHA256SUMS.txt`；校验方式：`sha256sum -c SHA256SUMS.txt`。'
            echo
            echo '### ⚠️ 首次打开可能被系统拦下（当前尚未做代码签名 / 公证）'
            echo
            echo '- **macOS**：未接 Apple 开发者账号做签名与公证。首次打开请**右键点图标 → 打开**，'
            echo '  或到「系统设置 → 隐私与安全性」底部点「仍要打开」。之后即可正常双击。'
            echo '- **Windows**：SmartScreen 可能提示「未知发布者」，点「更多信息 → 仍要运行」。'
            echo '- **Android**：APK 是**通用包**（4 个 ABI 的 Rust 产物打在一起，体积偏大），'
            echo '  尚未做 ABI 拆分；安装时需在系统里允许「安装未知来源的应用」。'
            echo '- **Linux**：AppImage 需要先 `chmod +x` 才能运行；`.deb` 用 `sudo dpkg -i` 安装。'
          } > RELEASE_NOTES.md
          echo "---- Release 说明（前 40 行）----"
          head -40 RELEASE_NOTES.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          IS_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          TITLE="Resume Studio v${VERSION}"

          # 布尔输入在非 dispatch 触发时为空串，这里统一成显式开关
          FLAGS=""
          if [ "$IS_PRERELEASE" = "true" ]; then FLAGS="$FLAGS --prerelease"; fi
          if [ "$IS_DRAFT" = "true" ]; then FLAGS="$FLAGS --draft"; fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # 幂等：重复发同一个版本时更新说明与资产，而不是报错
            echo "::notice::Release $TAG 已存在 → 更新标题、说明与资产（--clobber）"
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md $FLAGS
            gh release upload "$TAG" out/* --clobber
          else
            echo "::notice::创建 Release $TAG"
            TARGET=""
            # 手动触发时仓库里还没有这个标签，让 gh 基于当前 commit 建标签
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              TARGET="--target ${{ github.sha }}"
            fi
            gh release create "$TAG" out/* \
              --title "$TITLE" \
              --notes-file RELEASE_NOTES.md \
              $TARGET $FLAGS
          fi

          echo "=== 发布结果 ==="
          gh release view "$TAG" --json url,name,tagName,isPrerelease,isDraft \
            --template '{{.name}} ({{.tagName}}) prerelease={{.isPrerelease}} draft={{.isDraft}}{{"\n"}}{{.url}}{{"\n"}}'
          echo "=== 资产清单 ==="
          # ⚠️ gh 的 --template 用的是 **Go 模板**，只有 printf / len / index 这类内置函数，
          # **没有 divf 这类 Sprig 函数**（那是 Helm 的）。写了会报
          #   template: :1: function "divf" not defined
          # 而这行只是「打印清单」，却会让整个 job 以 exit 1 收场（Release 其实已经建好了）。
          # 所以：用 --jq 取原始字节数，再交给 awk 换算 MB —— 不依赖任何模板算术。
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)\t\(.size)"' \
            | while IFS=$'\t' read -r name size; do
                [ -z "$name" ] && continue
                printf '  %-52s %8s MB\n' "$name" \
                  "$(awk -v b="$size" 'BEGIN{printf "%.2f", b/1048576}')"
              done

          URL=$(gh release view "$TAG" --json url -q .url)
          {
            echo
            echo "### ✅ 已发布：[Resume Studio v${VERSION}](${URL})"
            echo
            echo "下载页：${URL}"
          } >> "$GITHUB_STEP_SUMMARY"
