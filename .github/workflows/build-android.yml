name: Build Android

# 产出 Android 安装包（APK / AAB）。CI 是唯一可行路径：绝大多数开发机（含本项目本机）
# 没有 JDK / Android SDK / NDK，无法本地构建（详见 docs/Android版构建说明.md）。
#
# Android 工程由 `tauri android init` 现场生成到 src-tauri/gen/android：
# 该目录是生成物、已在 .gitignore 中，仓库不提交任何手写的 Gradle / Kotlin / Manifest。
on:
  push:
    branches:
      - main
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'template.json'
      - 'vendor/**'
      - 'src-tauri/**'
      - 'tools/build-desktop-frontend.js'
      - 'package.json'
      - '.github/workflows/build-android.yml'
  pull_request:
  workflow_dispatch:
  # 供 .github/workflows/release.yml 复用（发版时调用，并用 `secrets: inherit`
  # 把 4 个签名 secret 传进来 —— 不传会静默退回 debug 签名）。
  workflow_call:

jobs:
  build-android:
    name: Android · APK + AAB
    runs-on: ubuntu-latest
    env:
      # Tauri 2 支持的稳定 NDK 版本；NDK_HOME 供 Gradle 与 Rust 链接器定位工具链
      NDK_VERSION: 27.0.12077973
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 设置 JDK 17（Temurin）
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        # 必须用 v4：v3.2.2 的默认 packages 里含 `tools`，而 Google 已把该包从 repository2-3.xml
        # 移除 → `sdkmanager tools` 报 "Failed to find package 'tools'" 并把整个 action 拖垮
        # （实测 v3 在 ubuntu-latest 上 20 秒即失败）。v4.0.2 起已去掉 tools，只装 platform-tools。
        uses: android-actions/setup-android@v4

      - name: 安装 Android NDK 并导出 NDK_HOME
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"

      - name: 设置 Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 设置 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 添加 4 个 Android 编译目标
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖
        run: npm install

      # 生成 Android 工程（等价 `tauri android init`）；仓库只提交 src-tauri/ 下的模板与配置，
      # gen/android 目录由本步现场生成，因此每次 CI 都是干净、与 CLI 版本匹配的工程。
      - name: 生成 Android 工程
        run: npm run mobile:android:init

      # 签名：4 个 secrets 齐全 → release 签名；缺任一 → 走 debug 签名并给出提示（不让 workflow 失败）。
      # keystore 绝不入库，只以 base64 形式存在 secrets 里，CI 时解码到 $RUNNER_TEMP。
      - name: 配置 Android 签名
        id: signing
        working-directory: src-tauri/gen/android
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 ANDROID_KEY_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD / ANDROID_STORE_PASSWORD，本次走 debug 签名（可装到真机验证，不能上架）"
            exit 0
          fi
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storeType=PKCS12"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "password=$ANDROID_KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::已写入 src-tauri/gen/android/keystore.properties（生成物，不入库）"
          # 生成模板的 app/build.gradle.kts 默认不含 release signingConfig，需按官方文档补三段：
          #   ① 文件开头加 `import java.io.FileInputStream`；
          #   ② 在 android{} 内、`buildTypes` 之前加 `signingConfigs { create("release") { ... } }`；
          #   ③ 在 release buildType 里 `signingConfig = signingConfigs.getByName("release")`。
          #
          # ⚠️ 三条都是踩过的坑，改这段前务必先读：
          # 1) 绝不能写 `java.util.Properties()` / `java.io.FileInputStream()` 这类**全限定名** ——
          #    Gradle Kotlin DSL 脚本的隐式接收者是 Project，而 Project 上挂着 `java` 扩展
          #    （JavaPluginExtension），`java` 这个标识符会被**遮蔽**成扩展访问 → 报
          #    `Unresolved reference: util` / `: io`，整条构建失败。必须靠文件顶层的 import 用简单名。
          # 2) import 必须**先查再插**。模板第一行本来就是 `import java.util.Properties`，
          #    无条件再插一遍会得到两行同名 import，Kotlin 直接报
          #    `Conflicting import, imported name 'Properties' is ambiguous` —— 同样整条构建失败。
          #    （2026-09-19 就是这么炸的：第 12 步绿、第 13 步红、白等 3 分半。）
          # 3) 锚点找不到时脚本必须立刻自己退出报错。模板结构一旦升级（比如 Tauri 改了
          #    app/build.gradle.kts 的写法），0 秒失败远好过让 Gradle 跑 3 分钟再抛一句
          #    `Script compilation errors`。
          python3 - <<'PY'
          import io, re, sys
          from textwrap import dedent

          p = 'app/build.gradle.kts'
          s = io.open(p, encoding='utf-8').read()

          def die(msg):
              sys.stderr.write('::error title=Android 签名补丁失败::' + msg + '\n')
              sys.exit(1)

          # 幂等：补过就跳过。`signingConfigs` 已存在也跳过 —— 万一将来模板自带 release
          # signingConfig，再插一次会撞 "Cannot add signing config 'release' ... already exists"。
          if 'keystore.properties' in s or 'signingConfigs' in s:
              print('::notice::release 签名配置已存在，跳过补丁')
              sys.exit(0)

          # ---- ① import：先查再插（坑 2）----
          # 需要两个：FileInputStream 用于读 keystore.properties；Properties 本来就在模板第一行。
          # 这里仍逐个做存在性判断 —— 缺哪个补哪个，绝不重复插入。
          IMPORTS = ['import java.io.FileInputStream', 'import java.util.Properties']
          missing = [x for x in IMPORTS
                     if not re.search(r'^[ \t]*' + re.escape(x) + r'[ \t]*$', s, re.M)]
          if missing:
              lines = s.split('\n')
              last_import = -1
              for i, ln in enumerate(lines[:80]):
                  if re.match(r'^[ \t]*import[ \t]', ln):
                      last_import = i
              if last_import >= 0:                      # 有 import：插到最后一条之后
                  for k, imp in enumerate(missing):
                      lines.insert(last_import + 1 + k, imp)
                  s = '\n'.join(lines)
              else:                                     # 无 import：插到 @file: 之后，或文件开头
                  m = re.match(r'((?:@file:[^\n]*\n)+)', s)
                  add = '\n'.join(missing) + '\n'
                  s = (m.group(1) + add + s[m.end():]) if m else (add + s)
              print('::notice::补入 import: ' + ' / '.join(missing))

          # ---- ② signingConfigs：插在 android{} 内、`buildTypes` 之前 ----
          SIGNING = dedent('''
              signingConfigs {
                  create("release") {
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      val keystoreProperties = Properties()
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                      }
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      storeType = keystoreProperties.getProperty("storeType", "PKCS12")
                  }
              }
          ''').strip('\n')

          m = re.search(r'^([ \t]*)buildTypes[ \t]*\{[ \t]*$', s, re.M)
          if not m:
              die('找不到顶层 `buildTypes {`，无法确定 signingConfigs 的插入位置（模板可能已升级）')
          indent = m.group(1)
          block = '\n'.join(indent + ln if ln else '' for ln in SIGNING.split('\n'))
          s = s[:m.start()] + block + '\n' + s[m.start():]

          # ---- ③ 让 release buildType 用上这个签名配置 ----
          m = re.search(r'^([ \t]*)getByName\("release"\)[ \t]*\{[ \t]*$', s, re.M)
          if not m:
              die('找不到 `getByName("release") {`（release buildType），无法挂上 signingConfig')
          s = (s[:m.end()] + '\n' + m.group(1) + '    signingConfig = signingConfigs.getByName("release")'
               + s[m.end():])

          # 原文件若不以换行结尾，不收尾会让后续内容与前一行粘连
          if not s.endswith('\n'):
              s += '\n'

          # ---- 自检：把「静默的错误产物」变成「当场失败」----
          def cnt(pat):
              return len(re.findall(pat, s, re.M))
          bad = []
          if cnt(r'^[ \t]*import[ \t]+java\.util\.Properties[ \t]*$') != 1:
              bad.append('`import java.util.Properties` 不是恰好 1 次（重复 import 会 Conflicting import）')
          if cnt(r'^[ \t]*import[ \t]+java\.io\.FileInputStream[ \t]*$') != 1:
              bad.append('`import java.io.FileInputStream` 不是恰好 1 次')
          if cnt(r'^[ \t]*signingConfigs[ \t]*\{[ \t]*$') != 1:
              bad.append('`signingConfigs {` 不是恰好 1 次')
          if cnt(r'^[ \t]*buildTypes[ \t]*\{[ \t]*$') != 1:
              bad.append('`buildTypes {` 不是恰好 1 次')
          if cnt(r'signingConfig = signingConfigs\.getByName\("release"\)') != 1:
              bad.append('`signingConfig = signingConfigs.getByName("release")` 不是恰好 1 次')
          if bad:
              for x in bad:
                  sys.stderr.write('::error title=Android 签名补丁自检失败::' + x + '\n')
              sys.exit(1)

          io.open(p, 'w', encoding='utf-8').write(s)
          print('::notice::已为 app/build.gradle.kts 写入 release 签名配置（生成物，不入库）')
          # 把结果整份打进日志：这一步连着排错，看不到实际写入的内容就只能靠猜（一次 CI 往返 5 分钟）
          print('---- 补丁后 build.gradle.kts（全文）----')
          for i, line in enumerate(s.splitlines(), 1):
              print(f'{i:>3}| {line}')
          PY

      # 一次构建同时产出 APK + AAB：`--apk --aab` 是同一进程内的两次打包，
      # 共享 Rust 产物；拆成两条命令会让 4 个 ABI 的 Rust 编译被完整跑两遍。
      #
      # 失败时主动把关键行转成 `::error::` annotation：annotation 能通过 API 读到，
      # 是排查 CI 失败的兜底通道（作业日志虽有 /actions/jobs/{id}/logs，但需要带
      # Actions:read 的 token，见 docs/Android版构建说明.md 第 8.1 节）。没有这段，
      # 失败信息就只能靠人肉打开网页看。
      - name: 构建 APK + AAB
        run: |
          set -o pipefail
          ARGS="--apk --aab"
          if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then ARGS="$ARGS --debug"; fi
          LOG="$RUNNER_TEMP/android-build.log"

          # 先记录环境事实，失败时这些也会进 annotation
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            echo "JAVA_HOME=$JAVA_HOME"
            echo "已装 rust target: $(rustup target list --installed | tr '\n' ' ')"
            echo "SDK 目录: $(ls "$ANDROID_HOME" 2>/dev/null | tr '\n' ' ')"
            echo "NDK 目录: $(ls "$ANDROID_HOME/ndk" 2>/dev/null | tr '\n' ' ')"
            df -h "$RUNNER_TEMP" | tail -1
          } > "$RUNNER_TEMP/android-env.txt" 2>&1 || true

          if npm run mobile:android:build -- $ARGS 2>&1 | tee "$LOG"; then
            exit 0
          fi

          echo "================ 关键行（完整输出见 Actions 界面）================"
          grep -nEi "error|failed|caused by|what went wrong|not found|exception|no such|cannot|unable|denied|no space" "$LOG" | tail -50 || true
          echo "================ 尾部 30 行 ================"
          tail -30 "$LOG" || true

          # 转成 annotation。注意 `%`、`\r`、`::` 都要转义，否则 workflow command 会被截断。
          # 三条互补：环境事实 / 关键词命中行 / 日志尾部。任一条都可能包含真正的原因，
          # 因为不同工具（Gradle、cargo、npm）报错格式完全不同。
          esc() { sed 's/%/%25/g; s/\r//g; s/::/ : : /g'; }
          ENVONE=$(tr '\n' '~' < "$RUNNER_TEMP/android-env.txt" | cut -c1-700)
          KEY=$(grep -nEi "error|failed|caused by|what went wrong|not found|exception|no such|cannot|unable|denied|no space" "$LOG" | tail -10 | esc | tr '\n' '~' | cut -c1-1400)
          TAIL=$(tail -c 1600 "$LOG" | esc | tr '\n' '~')
          echo "::error title=Android 构建失败｜环境::$ENVONE"
          # 注意：GitHub 的 run 默认是 `bash -e`，这里必须用 if 而不是 `[ -n .. ] && echo ..`，
          # 否则 KEY 为空时复合命令返回非零会直接中止步骤，把最后一条 annotation 吃掉。
          if [ -n "$KEY" ]; then
            echo "::error title=Android 构建失败｜关键词命中::$KEY"
          fi
          echo "::error title=Android 构建失败｜日志尾部::$TAIL"
          exit 1

      # 断言「产物真的用我们的上传密钥签了名」。
      #
      # 为什么必须有这一步：签名配置失败是**静默**的 —— Gradle 不会因为 secrets 为空而报错，
      # 只会悄悄退回 debug 签名，日志里只有一条不起眼的 notice。等到上架被 Play 拒绝时才发现，
      # 代价已经很大。这里把「证书指纹必须等于我们的上传密钥」变成硬断言。
      #
      # 换密钥时需同步更新下面的 EXPECTED_SHA256（值见 android-signing/ 里的凭据记录）。
      - name: 校验 APK 签名证书
        env:
          EXPECTED_SHA256: "8db64d11fa4a2c23730d9e7cd43d94c2c975168438e62a957361196c32135230"
        run: |
          set -o pipefail
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' 2>/dev/null | head -1 || true); fi
          if [ -z "$APK" ]; then
            echo "::error title=签名校验::未在 apk 输出目录找到任何 .apk"
            exit 1
          fi
          echo "待校验 APK: $APK ($(du -h "$APK" | cut -f1))"

          # apksigner 优先（能验 v2/v3 签名方案）；不在就退回 keytool（只认 v1）
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            echo "使用 $APKSIGNER"
            OUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          else
            echo "未找到 apksigner，退回 keytool -printcert -jarfile"
            OUT=$(keytool -printcert -jarfile "$APK" 2>&1 || true)
          fi
          echo "$OUT" | head -20

          # 两种工具的指纹格式不同（apksigner 无冒号小写 / keytool 带冒号大写），统一归一化后再比
          GOT=$(echo "$OUT" | grep -iE 'SHA-?256' | head -1 | tr -d ':' | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{64}' | head -1 || true)

          # ⚠️ 变量一律写成 ${VAR} 而不是 $VAR：bash 在 UTF-8 locale（CI 上是 C.UTF-8）下会把
          # 紧跟其后的多字节字符吃进变量名 —— `$EXPECTED_SHA256，` 会被解析成变量 `EXPECTED_SHA256，`
          # 而报 unbound variable。本地 `LC_ALL=C` 反而正常，所以很容易漏掉。
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            if [ "$GOT" = "$EXPECTED_SHA256" ]; then
              echo "::notice title=签名校验通过 ✅::APK 由上传密钥签名，SHA-256=$GOT"
            else
              echo "::error title=签名校验失败 ❌::期望 ${EXPECTED_SHA256}，实际 ${GOT:-<未取到>}。说明 secrets 虽已配置但签名未生效，产物不可上架"
              exit 1
            fi
          else
            echo "::warning title=签名校验跳过::本次走 debug 签名（secrets 未配置齐全），实际指纹 ${GOT:-<未取到>}。产物可装真机、不可上架"
          fi

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: resume-studio-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          # artifact 不可变，且 overwrite 默认 false：重跑时上次 attempt 的同名 artifact 仍在，
          # 上传会直接失败。理由详见 release.yml 里 release-meta 那段注释。
          overwrite: true
          retention-days: 14

      - name: 上传 AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: resume-studio-android-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          overwrite: true
          retention-days: 14
