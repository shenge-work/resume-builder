name: Build Android

# 产出 Android 安装包（APK / AAB）。CI 是唯一可行路径：绝大多数开发机（含本项目本机）
# 没有 JDK / Android SDK / NDK，无法本地构建（详见 docs/ANDROID-BUILD.md）。
#
# Android 工程由 `tauri android init` 现场生成到 src-tauri/gen/android：
# 该目录是生成物、已在 .gitignore 中，仓库不提交任何手写的 Gradle / Kotlin / Manifest。
on:
  push:
    branches:
      - main
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'template.json'
      - 'vendor/**'
      - 'src-tauri/**'
      - 'tools/build-desktop-frontend.js'
      - 'package.json'
      - '.github/workflows/build-android.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Android · APK + AAB
    runs-on: ubuntu-latest
    env:
      # Tauri 2 支持的稳定 NDK 版本；NDK_HOME 供 Gradle 与 Rust 链接器定位工具链
      NDK_VERSION: 27.0.12077973
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17（Temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android NDK 并导出 NDK_HOME
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk"

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 设置 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 添加 4 个 Android 编译目标
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖
        run: npm install

      # 生成 Android 工程（等价 `tauri android init`）；仓库只提交 src-tauri/ 下的模板与配置，
      # gen/android 目录由本步现场生成，因此每次 CI 都是干净、与 CLI 版本匹配的工程。
      - name: 生成 Android 工程
        run: npm run mobile:android:init

      # 签名：4 个 secrets 齐全 → release 签名；缺任一 → 走 debug 签名并给出提示（不让 workflow 失败）。
      # keystore 绝不入库，只以 base64 形式存在 secrets 里，CI 时解码到 $RUNNER_TEMP。
      - name: 配置 Android 签名
        id: signing
        working-directory: src-tauri/gen/android
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 ANDROID_KEY_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD / ANDROID_STORE_PASSWORD，本次走 debug 签名（可装到真机验证，不能上架）"
            exit 0
          fi
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "password=$ANDROID_KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::已写入 src-tauri/gen/android/keystore.properties（生成物，不入库）"
          # 生成模板的 app/build.gradle.kts 默认不含 release signingConfig（官方要求自行补一段）：
          # 仅在尚未配置时追加，保证幂等；已含 keystore.properties 引用则跳过。
          python3 - <<'PY'
          import io, sys
          p = 'app/build.gradle.kts'
          s = io.open(p, encoding='utf-8').read()
          if 'keystore.properties' in s:
              print('::notice::release 签名配置已存在，跳过补丁')
              sys.exit(0)
          patch = '''
          android {
              signingConfigs {
                  create("release") {
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      val keystoreProperties = java.util.Properties()
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))
                      }
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          '''
          with io.open(p, 'a', encoding='utf-8') as f:
              f.write(patch)
          print('::notice::已为 app/build.gradle.kts 追加 release 签名配置（生成物，不入库）')
          PY

      # 一次构建同时产出 APK + AAB：`--apk --aab` 是同一进程内的两次打包，
      # 共享 Rust 产物；拆成两条命令会让 4 个 ABI 的 Rust 编译被完整跑两遍。
      - name: 构建 APK + AAB
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            npm run mobile:android:build -- --apk --aab
          else
            npm run mobile:android:build -- --apk --aab --debug
          fi

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-studio-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传 AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-studio-android-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
